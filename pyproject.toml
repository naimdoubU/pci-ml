[project]
name = "pci-ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Naim", email = "gearboxarmy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jinja2>=3.1.6",
    "joblib>=1.6.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "tabulate>=0.10.0",
    "xgboost>=3.4.1",
]

[project.scripts]
pci-ml = "pci_ml:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
